stages:
  - test
  - deploy

test:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
    - npm test
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

deploy:
  stage: deploy
  tags:
    - self-hosted
  script:
    - cd ~/checkers && git pull origin main
    - ~/checkers/scripts/deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - test
